name: QA checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            qa/api/package-lock.json
      - run: python -m pip install -r backend/requirements.lock -r qa/automation/requirements.txt
      - run: python -m pip install --no-deps -e ./backend
      - run: python -m pip check
      - run: python -m ruff check backend qa/automation scripts
      - run: python -m ruff format --check backend qa/automation scripts
      - run: python -m pytest backend/tests -q --junitxml=test-results/api.xml
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npm --prefix qa/api ci
      - run: python scripts/check_api.py
      - run: python -m pytest qa/automation -q --junitxml=test-results/browser.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-results
          path: test-results/
